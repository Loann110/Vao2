<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vao2</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared by every view -->
  <link rel="stylesheet" href="global/styles/theme.css">
  <link rel="stylesheet" href="global/styles/base.css">
  <link rel="stylesheet" href="global/styles/layout.css">
  <link rel="stylesheet" href="global/styles/controls.css">
  <link rel="stylesheet" href="global/styles/responsive.css">

  <!-- One folder per part of the interface -->
  <link rel="stylesheet" href="feed/feed.css">
  <link rel="stylesheet" href="feed/video_player.css">
  <link rel="stylesheet" href="add_source/styles/setup.css">
  <link rel="stylesheet" href="add_source/styles/results.css">
  <link rel="stylesheet" href="add_source/styles/library.css">
  <link rel="stylesheet" href="ia_box/styles/article.css">
  <link rel="stylesheet" href="ia_box/styles/conversation.css">
  <link rel="stylesheet" href="ia_box/styles/responsive.css">
  <link rel="stylesheet" href="weather/weather.css">
  <link rel="stylesheet" href="reader/reader.css">

  <script type="module" src="main.js"></script>
</head>

<body>
  <div class="app">
    <!-- Sidebar: its entries are added by global/navigation.js -->
    <aside>
      <div class="logo">
        <b class="logo_icon">Vao2</b>
        <div class="little_description">Your <span>custom feed</span>, only for you</div>
      </div>

      <nav id="nav"></nav>

      <button class="theme_btn" id="theme_button" type="button" aria-label="Switch to dark theme">
        <span class="theme_icon" aria-hidden="true"></span>
        <span id="theme_label">Dark</span>
      </button>

      <div class="llm_status is_checking" id="llm_status" role="status">
        <span class="llm_status_dot" aria-hidden="true"></span>
        <span id="llm_status_label">Checking local model...</span>
      </div>
    </aside>

    <!-- Main view: the feed, the Weather view, or the "Add source" view -->
    <main>
      <header>
        <div>
          <h1 id="title">For you</h1>
          <div class="subtitle" id="subtitle"></div>
        </div>

        <div class="tools" id="feed_tools">
          <input id="feed_search" class="input" placeholder="Search in your feed..." />
          <select id="feed_category_filter" class="input" aria-label="Filter by category">
            <option value="all">All categories</option>
          </select>
          <button class="btn_primary" id="refresh_button" type="button">Refresh</button>
        </div>
      </header>

      <div class="notice" id="notice"></div>
      <section id="content"></section>
      <section id="add_source_view" aria-label="Add a source" hidden></section>
    </main>

    <!-- AI panel: filled by ia_box/ia_box.js -->
    <button id="ia_box_backdrop" type="button" aria-label="Close AI assistant" tabindex="-1"></button>
    <section id="ia_box" aria-live="polite" aria-label="AI assistant"></section>

    <!-- Weather assistant: takes the AI panel's place in the Weather view (weather/weather_assistant.js) -->
    <section id="wx_assistant_panel" aria-label="Weather assistant" hidden></section>
  </div>
</body>
</html>
